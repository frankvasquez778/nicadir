<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anto Template Clone</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a href="#" class="logo">Logo</a>
                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#shop">Shop</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
                <div class="cart">
                    <a href="#">Cart (0)</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="container">
            <h1>Welcome to Anto Shop</h1>
            <p>Your one-stop solution for all your shopping needs.</p>
            <a href="#shop" class="btn-primary">Shop Now</a>
        </div>
    </section>

    <!-- Featured Products Section -->
    <section id="shop" class="featured-products">
        <div class="container">
            <h2>Featured Products</h2>
            <div class="product-grid"></div>
            <div class="pagination"></div>
        </div>
    </section>

    <!-- About Section -->
    <section id="about" class="about">
        <div class="container">
            <h2>About Us</h2>
            <p>We are a team dedicated to bringing you the best online shopping experience.</p>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Anto Shop. All Rights Reserved.</p>
        </div>
    </footer>
</body>
</html>
