<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Profesional de Sublimación</title>
    <!-- W3.CSS -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f2f2f7;
            margin: 0;
        }
        header {
            background: linear-gradient(to bottom, #ffffff, #f9f9f9);
            color: #007aff;
            padding: 20px 0;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }
        .product-card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            background: #fff;
            margin-bottom: 20px;
        }
        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .product-card:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .product-content {
            padding: 15px;
            text-align: center;
        }
        .product-icon {
            font-size: 2rem;
            color: #007aff;
            margin-top: 10px;
            transition: transform 0.3s;
        }
        .product-card:hover .product-icon {
            transform: scale(1.3);
        }
        footer {
            background-color: #f9f9f9;
            color: #888;
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #e0e0e0;
        }
        .pagination {
            text-align: center;
            margin: 20px 0;
        }
        .pagination button {
            margin: 0 5px;
            padding: 10px 20px;
            border: 1px solid #007aff;
            border-radius: 10px;
            background-color: #007aff;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
        .pagination button:disabled {
            background-color: #f2f2f7;
            color: #999;
            border-color: #ddd;
            cursor: not-allowed;
        }
        .pagination button:hover:not(:disabled) {
            background-color: #005bb5;
            color: #fff;
        }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <h1><i class="fas fa-palette"></i> Creaciones Enmanuel</h1>
</header>

<!-- Main Content -->
<div class="w3-container w3-padding-32" id="main-content">
    <div class="w3-row-padding w3-center" id="product-list">
        <!-- Product cards will be dynamically added here -->
    </div>
    <div class="pagination" id="pagination">
        <!-- Pagination buttons will be dynamically added here -->
    </div>
</div>

<!-- Product Details -->
<div class="w3-container w3-padding-32 w3-hide" id="product-details">
    <button class="w3-button w3-light-grey w3-margin-bottom" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> Atrás
    </button>
    <div id="details-content" class="w3-card w3-padding"></div>
</div>

<!-- Footer -->
<footer>
    <p>&copy; 2024 Sublimación Creativa | Elegancia al estilo iOS</p>
</footer>

<script src="products.js"></script>
<script src="script.js"></script>
</body>
</html>
