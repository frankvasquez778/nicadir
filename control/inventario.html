<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Camisas</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/parse/dist/parse.min.js"></script>
    <style>
        /* Responsividad adicional */
        @media (max-width: 768px) {
            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }
        /* Estilo para tabla con bordes y filas alternadas */
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: left;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <!-- Encabezado -->
    <header class="bg-white shadow-md p-4 fixed top-0 w-full z-10">
        <h1 class="text-2xl font-bold text-center text-blue-600">Inventario de Camisas</h1>
    </header>

    <!-- Contenedor principal -->
    <main id="mainContent" class="mt-32 px-4 md:px-8">
        <!-- Registro de Camisas -->
        <section id="camisasSection" class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">Inventario de Camisas</h2>
            <button id="openCamisaModal" class="bg-blue-600 text-white px-4 py-2 rounded-md">Agregar Camisa</button>
            
        </section>

    <div class="overflow-x-auto">
                <table id="camisasTable" class="mt-6">
                    <thead>
                        <tr>
                            <th class="py-2 px-4">Tipo</th>
                            <th class="py-2 px-4">Talla</th>
                            <th class="py-2 px-4">Color</th>
                            <th class="py-2 px-4">Material</th>
                            <th class="py-2 px-4">Precio</th>
                            <th class="py-2 px-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Aquí se llenarán los datos dinámicamente -->
                    </tbody>
                </table>
                <div id="pagination" class="flex justify-center mt-4">
                    <!-- Botones de paginación se generarán dinámicamente -->
                </div>
            </div>
    </main>

    <!-- Modal para registro de camisas -->
    <div id="camisaModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-20">
        <div class="bg-white rounded-xl shadow-md p-6 w-full max-w-md">
            <h2 class="text-lg font-semibold mb-4">Registrar Camisa</h2>
            <form id="camisaForm">
                <div class="mb-4">
                    <label for="camisaTipo" class="block text-sm font-medium">Tipo de Camisa</label>
                    <select id="camisaTipo" class="w-full p-2 border rounded-md">
                        <option value="Unisex Tacto">Unisex Tacto Algodon</option>
                        <option value="Polo">Polo</option>
                        <option value="Waffit">Waffit</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="camisaTalla" class="block text-sm font-medium">Talla</label>
                    <select id="camisaTalla" class="w-full p-2 border rounded-md">
                        <optgroup label="Númericas">
                            <option value="2">2</option>
                            <option value="4">4</option>
                            <option value="6">6</option>
                            <option value="8">8</option>
                            <option value="10">10</option>
                            <option value="12">12</option>
                            <option value="14">14</option>
                            <option value="16">16</option>
                            <option value="18">18</option>
                        </optgroup>
                        <optgroup label="Letras">
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                        </optgroup>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="camisaColor" class="block text-sm font-medium">Color</label>
                    <select id="camisaColor" class="w-full p-2 border rounded-md">
                        <option value="blanco">Blanco</option>
                        <option value="negro">Negro</option>
                        <option value="rojo">Rojo</option>
                        <option value="verde">Verde</option>
                        <option value="azul">Azul</option>
                        <option value="amarillo">Amarillo</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="camisaMaterial" class="block text-sm font-medium">Material</label>
                    <select id="camisaMaterial" class="w-full p-2 border rounded-md">
                        <option value="tacto algodon">Tacto Algodón</option>
                        <option value="algodon">Algodón</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="camisaPrecio" class="block text-sm font-medium">Precio</label>
                    <input type="number" id="camisaPrecio" class="w-full p-2 border rounded-md" placeholder="Precio" required />
                </div>
                <div class="flex justify-end">
                    <button type="button" id="closeCamisaModal" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-md mr-2">Cancelar</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md">Registrar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="./js/camisas.js"></script>
    <script>
        // Abrir y cerrar modal
        document.getElementById('openCamisaModal').addEventListener('click', () => {
            document.getElementById('camisaModal').classList.remove('hidden');
        });

        document.getElementById('closeCamisaModal').addEventListener('click', () => {
            document.getElementById('camisaModal').classList.add('hidden');
        });
    </script>
</body>
</html>
