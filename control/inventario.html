<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Camisas</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/parse/dist/parse.min.js"></script>
    <style>
        /* Responsividad adicional */
        @media (max-width: 768px) {
            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }
        /* Estilo para tabla con bordes y filas alternadas */
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: left;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <!-- Encabezado -->
    <header class="bg-white shadow-md p-4 fixed top-0 w-full z-10 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-600">Inventario de Camisas</h1>
        <button id="logoutButton" class="bg-red-500 text-white px-4 py-2 rounded-md hidden">Cerrar Sesión</button>
    </header>

    <!-- Contenedor principal -->
    <main id="mainContent" class="mt-32 px-4 md:px-8 hidden">
	
	
	 <!-- Resumen de Camisas -->
        <section id="resumenSection" class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">Resumen de Inventario</h2>
            <div class="overflow-x-auto">
                <table id="resumenTable" class="mt-6">
                    <thead>
                        <tr>
                            <th class="py-2 px-4">Tipo</th>
                            <th class="py-2 px-4">Talla</th>
                            <th class="py-2 px-4">Color</th>
                            <th class="py-2 px-4">Material</th>
                            <th class="py-2 px-4">Cantidad</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Aquí se llenará el resumen dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>
	
	
	
	
	
	
	
        <!-- Registro de Camisas -->
        <section id="camisasSection" class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">Inventario de Camisas</h2>
            <button id="openCamisaModal" class="bg-blue-600 text-white px-4 py-2 rounded-md">Agregar Camisa</button>
            <div class="overflow-x-auto">
                <table id="camisasTable" class="mt-6">
                    <thead>
                        <tr>
                            <th class="py-2 px-4">Tipo</th>
                            <th class="py-2 px-4">Talla</th>
                            <th class="py-2 px-4">Color</th>
                            <th class="py-2 px-4">Material</th>
                            <th class="py-2 px-4">Precio</th>
                            <th class="py-2 px-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Aquí se llenarán los datos dinámicamente -->
                    </tbody>
                </table>
                <div id="pagination" class="flex justify-center mt-4">
                    <!-- Botones de paginación se generarán dinámicamente -->
                </div>
            </div>
        </section>

       
    </main>

    <!-- Modal de Autenticación -->
    <div id="authModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-20">
        <div class="bg-white rounded-xl shadow-md p-6 w-full max-w-sm">
            <h2 class="text-lg font-semibold mb-4" id="authTitle">Iniciar Sesión</h2>
            <form id="authForm">
                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium">Usuario</label>
                    <input type="text" id="username" class="w-full p-2 border rounded-md" placeholder="Nombre de usuario" required />
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium">Contraseña</label>
                    <input type="password" id="password" class="w-full p-2 border rounded-md" placeholder="Contraseña" required />
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md">Entrar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/camisas.js"></script>
    <script>
        // Mostrar/ocultar contenido basado en autenticación
        const mainContent = document.getElementById('mainContent');
        const logoutButton = document.getElementById('logoutButton');

        Parse.User.current() ? mainContent.classList.remove('hidden') : mainContent.classList.add('hidden');
        Parse.User.current() ? logoutButton.classList.remove('hidden') : logoutButton.classList.add('hidden');

        logoutButton.addEventListener('click', async () => {
            await Parse.User.logOut();
            location.reload();
        });
    </script>
</body>
</html>
